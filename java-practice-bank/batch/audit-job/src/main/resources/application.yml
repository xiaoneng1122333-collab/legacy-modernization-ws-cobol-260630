spring:
  application:
    name: audit-job
  batch:
    job:
      names: ${job.name:auditJob}
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:cobol}
    password: ${DB_PASSWORD:cobol}
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
audit:
  business:
    date: ${AUDIT_BIZ_DATE:}
  rollover:
    operator-user: ${AUDIT_ROLL_OPERATOR:}
    retention-days: ${AUDIT_ROLL_RETENTION:30}
    dry-run: ${AUDIT_ROLL_DRY:N}
    enable-detach: ${AUDIT_ROLL_DETACH:N}
  forensic:
    date-start: ${AUDIT_FORE_START:}
    date-end: ${AUDIT_FORE_END:}
    subsystem: ${AUDIT_FORE_SUBSYS:}
    action: ${AUDIT_FORE_ACTION:}
    severity: ${AUDIT_FORE_SEVERITY:}
    account-filter: ${AUDIT_FORE_ACCOUNT:}
    max-rows: ${AUDIT_FORE_MAX:1000}
    output-format: ${AUDIT_FORE_FMT:TEXT}
    output-filename: ${AUDIT_FORE_FILE:}
    operator-user: ${AUDIT_FORE_OPERATOR:}
    file-output: ${AUDIT_FORE_FILE_OUT:false}
  summary:
    date-start: ${AUDIT_SUM_START:}
    date-end: ${AUDIT_SUM_END:}
    mode: ${AUDIT_SUM_MODE:D}
    output-filename: ${AUDIT_SUM_FILE:}
