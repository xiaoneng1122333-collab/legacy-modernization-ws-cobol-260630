spring:
  application:
    name: interestpost-job
  batch:
    job:
      names: ${job.name:interestpostRunMonthend}
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:cobol}
    password: ${DB_PASSWORD:cobol}
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
interestpost:
  run:
    sys-expense-account: ${IPST_SYS_EXPENSE_ACCOUNT:9999999999999}
