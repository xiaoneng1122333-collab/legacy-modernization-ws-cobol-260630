spring:
  application:
    name: operations-job
  batch:
    job:
      names: ${job.name:opsBatchDailyJob}
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:cobol}
    password: ${DB_PASSWORD:cobol}
mybatis:
  mapper-locations: classpath:mappers/**/*.xml

# OPS-BATCH-DAILY の操作パラメータ
ops:
  business-date: ${OPS_BUSINESS_DATE:}
  batch-id: ${OPS_BATCH_ID:}
  dry-run: ${OPS_DRIVE_RUN:N}
