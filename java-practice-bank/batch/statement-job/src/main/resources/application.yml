spring:
  application:
    name: statement-job
  batch:
    job:
      names: ${job.name:stmtGenerateRun}
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:cobol}
    password: ${DB_PASSWORD:cobol}
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
statement:
  generate:
    max-customers: ${STMT_MAX_CUSTOMERS:500}
    max-accounts: ${STMT_MAX_ACCOUNTS:1000}
    max-txns-per-account: ${STMT_MAX_TXNS_PER_ACCOUNT:500}
    default-mode: ${STMT_MODE:D}
